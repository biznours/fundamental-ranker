name: Classement fondamental hebdomadaire

on:
  schedule:
    # Lundi 9h30 à New York, comme le scanner wheel. GitHub ne raisonne qu'en
    # UTC et ignore le changement d'heure américain : on déclare donc les deux
    # horaires possibles et l'étape "Verifier la saison" ne garde que le bon.
    #   - été  (EDT) : 13:30 UTC = 9h30 ET
    #   - hiver (EST) : 14:30 UTC = 9h30 ET
    - cron: "30 13 * * 1"
    - cron: "30 14 * * 1"
  workflow_dispatch:

jobs:
  classement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Verifier la saison (evite un double calcul)
        id: saison
        run: |
          # Declenchement manuel : on fait confiance a l'utilisateur.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Declenchement manuel -> calcul"
            echo "skip=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          DST=$(TZ=America/New_York date +%Z)
          SCHEDULE="${{ github.event.schedule }}"
          if [ "$DST" = "EDT" ] && [ "$SCHEDULE" = "30 13 * * 1" ]; then
            echo "Ete (EDT), horaire principal -> calcul"
            echo "skip=0" >> $GITHUB_OUTPUT
          elif [ "$DST" = "EST" ] && [ "$SCHEDULE" = "30 14 * * 1" ]; then
            echo "Hiver (EST), horaire principal -> calcul"
            echo "skip=0" >> $GITHUB_OUTPUT
          else
            echo "DST=$DST schedule='$SCHEDULE' -> horaire secondaire, on passe"
            echo "skip=1" >> $GITHUB_OUTPUT
          fi

      - name: Récupérer le code
        if: steps.saison.outputs.skip == '0'
        uses: actions/checkout@v4

      - name: Installer Python
        if: steps.saison.outputs.skip == '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        if: steps.saison.outputs.skip == '0'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        if: steps.saison.outputs.skip == '0'
        run: |
          pip install pytest
          pytest -q

      - name: Calculer le classement
        if: steps.saison.outputs.skip == '0'
        run: python -m ranker.main

      - name: Enregistrer le classement s'il a changé
        if: steps.saison.outputs.skip == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classement/classement.json
          if git diff --cached --quiet; then
            echo "Classement inchangé, rien à enregistrer."
            exit 0
          fi
          git commit -m "Classement fondamental du $(date -u +%Y-%m-%d)"
          git push
