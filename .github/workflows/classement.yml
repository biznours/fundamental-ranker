name: Classement fondamental hebdomadaire

on:
  schedule:
    # Lundi 06:00 UTC (8h à Paris l'été, 7h l'hiver). Les fondamentaux ne
    # bougent pas dans la journée : un retard de GitHub Actions est sans effet.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  classement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancer les tests
        run: |
          pip install pytest
          pytest -q

      - name: Calculer le classement
        run: python -m ranker.main

      - name: Enregistrer le classement s'il a changé
        run: |
          if git diff --quiet -- classement/classement.json; then
            echo "Classement inchangé, rien à enregistrer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add classement/classement.json
          git commit -m "Classement fondamental du $(date -u +%Y-%m-%d)"
          git push
